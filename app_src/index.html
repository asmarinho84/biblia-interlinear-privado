<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a3b1c">
<title>Bíblia Interlinear</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" role="dialog" aria-modal="true" aria-label="Abertura">
  <div class="sp-logo"><svg viewBox="0 0 120 120" width="92" height="92"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset=".42" stop-color="#a8501f"/><stop offset=".58" stop-color="#1d5fa6"/></linearGradient></defs><rect width="120" height="120" rx="27" fill="url(#g)"/><path d="M16 38l44 5 44-5v44l-44 6-44-6z" fill="#00000030" transform="translate(0 3)"/><path d="M16 36l44 5v42l-44-6z" fill="#fff8ee"/><path d="M104 36l-44 5v42l44-6z" fill="#f2f7ff"/><text x="38" y="73" font-size="30" font-weight="700" text-anchor="middle" fill="#a8501f" font-family="DejaVu Sans,Arial,sans-serif">א</text><text x="82" y="73" font-size="30" font-weight="700" text-anchor="middle" fill="#1d5fa6" font-family="DejaVu Sans,Arial,sans-serif">α</text></svg></div>
  <div class="sp-t">Bíblia Interlinear</div>
  <div class="sp-s">Original · Transliteração · Interlinear · ARC</div>
  <figure class="sp-card" id="spcard"></figure>
  <button id="spok" class="sp-ok" type="button">Entrar</button>
  <div class="sp-v" id="spv">versão 1.1</div>
</div>
<header id="top">
  <div class="hl"><button id="btnBack" class="ib" aria-label="Voltar" hidden>‹</button><button id="btnSearch" class="ib" aria-label="Buscar na ARC"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button></div>
  <h1 id="title">Bíblia Interlinear</h1>
  <div class="hr"><button id="btnAbout" class="ib" aria-label="Ajuda e sobre o app"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></button>
  <button id="btnCfg" class="ib" aria-label="Configurações de leitura">⚙</button></div>
</header>

<main id="view" tabindex="-1"></main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-box" role="dialog" aria-label="Configurações">
    <div class="sheet-h"><b>Configurações de leitura</b><button class="ib" data-close aria-label="Fechar">✕</button></div>
    <div class="sheet-b" id="cfgBody"></div>
  </div>
</div>

<div id="about" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-box" role="dialog" aria-label="Ajuda e sobre">
    <div class="sheet-h"><b>Ajuda e sobre</b><button class="ib" data-close aria-label="Fechar">✕</button></div>
    <div class="sheet-b" id="aboutBody"></div>
  </div>
</div>
<div id="pop" class="pop" hidden></div>
<script src="data/livros.js"></script>
<script src="data/meta.js"></script>
<script src="app.js"></script>
</body>
</html>
